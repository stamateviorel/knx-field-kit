name: Build KNX Field Kit Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Core Unit Tests
        run: ./gradlew :core-model:test :core-knxproj:test --no-daemon

      - name: Assemble Android Debug APK
        run: ./gradlew :app-android:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p dist
          cp app-android/build/outputs/apk/debug/app-android-debug.apk dist/KNXFieldKit-android-v3.7.apk
          ls -lh dist/

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KNXFieldKit-android-v3.7-apk
          path: dist/KNXFieldKit-android-v3.7.apk
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/KNXFieldKit-android-v3.7.apk
          name: "KNX Field Kit ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
